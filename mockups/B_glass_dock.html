<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:'Manrope',sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:#000}
.wall{position:absolute;inset:0;background:url(img/h1016.jpg) center 60%/cover}
.tint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(10,12,20,.05),rgba(10,12,20,.45) 75%),linear-gradient(180deg,rgba(8,10,18,.35),rgba(8,10,18,0) 40%,rgba(8,10,18,.45))}
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 60px rgba(0,0,0,.25)}
.clock{position:absolute;top:120px;left:0;right:0;text-align:center}
.clock .t{font-family:'Inter';font-weight:200;font-size:250px;letter-spacing:-.05em;line-height:1;text-shadow:0 8px 40px rgba(0,0,0,.25)}
.clock .d{margin-top:18px;font-size:30px;font-weight:500;letter-spacing:.02em;color:rgba(255,255,255,.9)}
.w{position:absolute;top:96px;left:96px;width:360px;padding:28px 30px;border-radius:34px}
.w .loc{font-size:18px;font-weight:600;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px}
.w .big{display:flex;align-items:center;gap:16px;margin-top:8px}
.w .tmp{font-family:'Inter';font-weight:200;font-size:84px;letter-spacing:-.04em;line-height:1}
.w .cond{font-size:18px;font-weight:600;line-height:1.45}
.w .cond small{display:block;font-weight:500;color:rgba(255,255,255,.7);font-size:16px}
.hrs{display:flex;justify-content:space-between;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.18)}
.hrs div{text-align:center;font-size:15px;font-weight:600;color:rgba(255,255,255,.75)}
.hrs div b{display:block;font-size:19px;color:#fff;margin-top:6px}
.hrs svg{width:24px;height:24px;margin-top:6px}
.n{position:absolute;top:96px;right:96px;width:360px;padding:26px 28px;border-radius:34px}
.n h4{font-size:16px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.7)}
.inp{display:flex;align-items:center;gap:16px;margin-top:18px}
.inp i{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:800}
.inp .x{font-size:19px;font-weight:600}.inp .x small{display:block;font-size:15px;font-weight:500;color:rgba(255,255,255,.65)}
.live{margin-left:auto;width:10px;height:10px;border-radius:50%;background:#5BE38B;box-shadow:0 0 12px #5BE38B}
.dockwrap{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:center}
.dock{display:flex;align-items:flex-end;gap:26px;padding:22px 30px;border-radius:52px;-webkit-box-reflect:below 14px linear-gradient(transparent 62%,rgba(255,255,255,.16))}
.ic{width:112px;height:112px;border-radius:30px;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.25)}
.ic:before{content:"";position:absolute;inset:0;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 50%)}
.ic svg{width:52px;height:52px;position:relative}
.ic.f{width:150px;height:150px;border-radius:40px;margin:0 6px;transform:translateY(-26px);box-shadow:0 0 0 4px rgba(255,255,255,.95),0 24px 60px rgba(0,0,0,.45),0 0 70px rgba(255,120,90,.55)}
.ic.f:before{border-radius:40px}
.ic.f svg{width:70px;height:70px}
.lab{position:absolute;top:-66px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:9px 20px;border-radius:999px;font-size:19px;font-weight:700;background:rgba(255,255,255,.92);color:#111}
.sepv{width:2px;height:84px;align-self:center;background:rgba(255,255,255,.25);border-radius:2px}
.foot{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:15px;font-weight:600;color:rgba(255,255,255,.55);letter-spacing:.06em}
</style></head><body>
